<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spread by Masdaq</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="15" width="5" height="9" rx="1" fill="#2B6CB0"/><rect x="10.5" y="9" width="5" height="15" rx="1" fill="#7FB069"/><rect x="19" y="3" width="5" height="21" rx="1" fill="#E07A3F"/></svg>
    <span data-brand></span>
  </a>
  <nav class="nav-links">
    <a href="index.html#ask" data-i18n="nav_search"></a>
    <a href="assets.html" data-i18n="nav_assets"></a>
    <button class="btn lang" type="button" aria-label="Langue / Language"></button>
  </nav>
</header>

<main class="asset">
  <a class="back" href="index.html#results" data-i18n="back"></a>
  <h1 id="name"></h1>
  <p class="meta" id="meta"></p>

  <div class="chart-card glass">
    <div class="chart-top">
      <div class="big-change num" id="change"></div>
      <div class="ranges" id="ranges"></div>
    </div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="stats" id="stats"></div>
  <section class="why glass" id="why" hidden aria-live="polite"></section>
  <p class="footnote" data-i18n="footnote"></p>
</main>

<script src="i18n.js"></script>
<script src="chart.js"></script>
<script src="asset.js"></script>
</body>
</html>
