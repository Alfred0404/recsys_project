<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complément</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body class="landing">

<header class="top">
  <a class="brand" href="#top">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="15" width="5" height="9" rx="1" fill="#2B6CB0"/><rect x="10.5" y="9" width="5" height="15" rx="1" fill="#7FB069"/><rect x="19" y="3" width="5" height="21" rx="1" fill="#E07A3F"/></svg>
    <span data-brand></span>
  </a>
  <nav class="nav-links">
    <a href="#method" data-i18n="nav_method"></a>
    <a href="#evidence" data-i18n="nav_results"></a>
    <a href="assets.html" data-i18n="nav_assets"></a>
    <button class="btn lang" type="button" aria-label="Langue / Language"></button>
    <a class="btn primary" href="#ask" data-i18n="cta_try"></a>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-copy">
      <h1 data-i18n="hero"></h1>
      <p class="sub" data-i18n="hero_sub"></p>
      <div class="cta">
        <a class="btn primary big" href="#ask" data-i18n="cta_try"></a>
        <a class="btn ghost big" href="#method" data-i18n="cta_method"></a>
      </div>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </div>

    <figure class="graph-card" id="graph-card">
      <div class="graph" id="graph"></div>
      <div class="ceiling-control">
        <label for="ceiling" id="ceiling-label"></label>
        <input id="ceiling" type="range" min="1" max="7" step="1" value="4">
      </div>
      <figcaption id="graph-caption"></figcaption>
    </figure>
  </section>

  <section class="facts" aria-labelledby="facts-title">
    <h2 class="visually-hidden" id="facts-title" data-i18n="facts_title"></h2>
    <dl class="facts-grid">
      <div><dt class="num">388 048</dt><dd data-i18n="fact_tx"></dd></div>
      <div><dt class="num">29 090</dt><dd data-i18n="fact_clients"></dd></div>
      <div><dt class="num">320</dt><dd data-i18n="fact_assets"></dd></div>
      <div><dt class="num">1</dt><dd data-i18n="fact_median"></dd></div>
      <div><dt class="num" data-i18n="fact_top_v"></dt><dd data-i18n="fact_top"></dd></div>
    </dl>
  </section>

  <section class="method" id="method">
    <h2 data-i18n="method_title"></h2>
    <p class="lede" data-i18n="method_lede"></p>
    <ol class="steps">
      <li style="--c: var(--r1)"><span class="step-n num" data-i18n="step_1_n"></span><h3 data-i18n="step_1_t"></h3><p data-i18n="step_1_d"></p></li>
      <li style="--c: var(--r3)"><span class="step-n num" data-i18n="step_2_n"></span><h3 data-i18n="step_2_t"></h3><p data-i18n="step_2_d"></p></li>
      <li style="--c: var(--r4)"><span class="step-n num" data-i18n="step_3_n"></span><h3 data-i18n="step_3_t"></h3><p data-i18n="step_3_d"></p></li>
      <li style="--c: var(--r5)"><span class="step-n num" data-i18n="step_4_n"></span><h3 data-i18n="step_4_t"></h3><p data-i18n="step_4_d"></p></li>
    </ol>
  </section>

  <section class="evidence" id="evidence">
    <h2 data-i18n="ev_title"></h2>
    <p class="lede" data-i18n="ev_lede"></p>
    <div class="ev-grid">
      <figure class="card bars">
        <figcaption><b data-i18n="ev_bars_title"></b><span data-i18n="ev_bars_sub"></span></figcaption>
        <div class="bar" style="--w: 7%; --c: var(--neutral)"><span data-i18n="m_random"></span><i></i><b class="num">0,015</b></div>
        <div class="bar" style="--w: 84%; --c: var(--neutral)"><span data-i18n="m_popular"></span><i></i><b class="num">0,166</b></div>
        <div class="bar" style="--w: 96%; --c: var(--r1)"><span data-i18n="m_nlgcl"></span><i></i><b class="num">0,189</b></div>
        <div class="bar" style="--w: 100%; --c: var(--r2)"><span data-i18n="m_lightgcn"></span><i></i><b class="num">0,197</b></div>
        <p data-i18n="ev_bars_note"></p>
      </figure>
      <div class="ev-side">
        <div class="card stat-big">
          <p class="num big"><span class="hot">76 %</span> <span class="arrow" aria-hidden="true">→</span> <span class="cool">0 %</span></p>
          <p data-i18n="ev_violation"></p>
        </div>
        <div class="card stat-big">
          <p class="num big">0,217 <span class="arrow" aria-hidden="true">→</span> 0,356</p>
          <p data-i18n="ev_suitable"></p>
        </div>
      </div>
    </div>
    <div class="limits">
      <h3 data-i18n="lim_title"></h3>
      <ul>
        <li data-i18n="lim_1"></li>
        <li data-i18n="lim_2"></li>
        <li data-i18n="lim_3"></li>
      </ul>
    </div>
  </section>

  <section class="ask" id="ask">
    <div class="ask-panel">
      <h2 data-i18n="ask_title"></h2>
      <form id="form" class="ask-form" autocomplete="off">
        <section class="ask-step" aria-labelledby="step-assets">
          <h3 id="step-assets"><span class="step-dot num">1</span><span data-i18n="step_assets"></span></h3>
          <p class="hint" data-i18n="step_assets_help"></p>
          <div class="search-wrap">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
              <input id="query" type="text" maxlength="150" data-i18n-placeholder="placeholder" data-i18n-label="search_label"
                     role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
            </div>
            <div class="suggest" id="suggest-box" hidden>
              <div class="suggest-tabs" id="suggest-tabs"></div>
              <p class="suggest-head" id="suggest-head"></p>
              <ul id="suggest" role="listbox"></ul>
            </div>
          </div>
          <div class="ask-shortcuts">
            <button class="btn ghost-light" type="button" id="example" data-i18n="try_example"></button>
            <a class="link-light" href="assets.html" data-i18n="search_browse"></a>
          </div>
          <div class="holdings" id="chips" aria-live="polite"></div>
        </section>

        <section class="ask-step" aria-labelledby="step-profile">
          <h3 id="step-profile"><span class="step-dot num">2</span><span data-i18n="mode_label"></span></h3>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="profile-mode" value="questionnaire" checked> <span data-i18n="mode_quiz"></span></label>
            <label><input type="radio" name="profile-mode" value="text"> <span data-i18n="mode_text"></span></label>
          </div>
          <div class="option-grid" id="option-grid"></div>
          <label class="objective" id="text-profile" hidden>
            <span data-i18n="objective_label"></span>
            <textarea id="objective" rows="2" maxlength="500" data-i18n-placeholder="objective_placeholder"></textarea>
          </label>
        </section>

        <section class="ask-step ask-go">
          <h3><span class="step-dot num">3</span><span data-i18n="step_go"></span></h3>
          <div class="go-row">
            <button class="btn accent big" type="submit" id="go" data-i18n="go"></button>
            <label class="years" id="years-box"></label>
          </div>
          <p class="hint error" id="error" role="alert" hidden></p>
        </section>
      </form>
    </div>
  </section>

  <section class="results" id="results" hidden aria-live="polite"></section>

  <section class="team" id="team">
    <h2 data-i18n="team_title"></h2>
    <ul>
      <li><b>Ethan Petain</b><span data-i18n="role_ethan"></span></li>
      <li><b>Alfred De Vulpian</b><span data-i18n="role_alfred"></span></li>
      <li><b>Nicolas Cottez-Abrate</b><span data-i18n="role_nicolas"></span></li>
      <li><b>Thomas Confolent</b><span data-i18n="role_thomas"></span></li>
    </ul>
  </section>
</main>

<footer class="site"><span data-i18n="footer_data"></span><a href="https://github.com/Alfred0404/recsys_project" data-i18n="footer_code"></a></footer>

<script src="i18n.js"></script>
<script src="chart.js"></script>
<script src="search.js"></script>
<script src="landing.js"></script>
<script src="app.js"></script>
</body>
</html>
