<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spread</title>
<link rel="icon" href="logo.svg?v=spread" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#">
    <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#f4f4f5"><rect x="14" y="14" width="14" height="14" rx="4"/><rect x="38" y="14" width="14" height="14" rx="4"/><rect x="62" y="14" width="14" height="14" rx="4"/><rect x="14" y="38" width="14" height="14" rx="4"/><rect x="38" y="38" width="14" height="14" rx="4"/><rect x="62" y="38" width="14" height="14" rx="4"/><rect x="14" y="62" width="14" height="14" rx="4"/><rect x="38" y="62" width="14" height="14" rx="4"/></g><rect x="65" y="65" width="16" height="16" rx="4.6" fill="#2f6bff" transform="rotate(18 73 73)"/></svg>
    <span data-brand></span>
  </a>
  <nav class="nav-links">
    <a href="index.html#ask" data-i18n="nav_search"></a>
    <a href="assets.html" data-i18n="nav_assets"></a>
    <button class="btn lang" type="button" aria-label="Langue / Language"></button>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="lockup"><svg class="mark-anim" viewBox="0 0 100 100" aria-hidden="true"><g fill="#f4f4f5"><rect x="14" y="14" width="14" height="14" rx="4"/><rect x="38" y="14" width="14" height="14" rx="4"/><rect x="62" y="14" width="14" height="14" rx="4"/><rect x="14" y="38" width="14" height="14" rx="4"/><rect x="38" y="38" width="14" height="14" rx="4"/><rect x="62" y="38" width="14" height="14" rx="4"/><rect x="14" y="62" width="14" height="14" rx="4"/><rect x="38" y="62" width="14" height="14" rx="4"/></g><rect class="piece" x="65" y="65" width="16" height="16" rx="4.6"/></svg><span data-brand></span></div>
    <h1 data-i18n="hero"></h1>
    <p class="sub" data-i18n="hero_sub"></p>
    <div class="cta">
      <a class="btn primary" href="#ask"><span data-i18n="cta_try"></span></a>
    </div>
    <div class="preview glass" aria-hidden="true">
      <div class="preview-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <span class="typed" data-i18n="preview_query"></span>
      </div>
      <div class="preview-rows" id="preview-rows"></div>
      <div class="preview-foot"><span data-i18n="preview_foot"></span><span>FAR-Trans · NLGCL</span></div>
    </div>
  </section>

  <section class="how" id="how">
    <h2 data-i18n="how_title"></h2>
    <p class="lede" data-i18n="how_lede"></p>
    <div class="how-line">
      <div class="how-step">
        <div class="how-dot">1</div>
        <h3 data-i18n="s1_title"></h3>
        <p data-i18n="s1_body"></p>
        <button class="how-ex glass" type="button" id="how-try" data-i18n-label="how_try"><span id="how-typed"></span></button>
      </div>
      <div class="how-step">
        <div class="how-dot">2</div>
        <h3 data-i18n="s2_title"></h3>
        <p data-i18n="s2_body"></p>
        <div class="how-ex glass num" id="how-count"></div>
      </div>
      <div class="how-step">
        <div class="how-dot">3</div>
        <h3 data-i18n="s3_title"></h3>
        <p data-i18n="s3_body"></p>
        <a class="how-ex glass" id="how-asset" href="asset.html?isin=GRF000045002"><span id="how-spark"></span><span id="how-change" class="num"></span></a>
      </div>
    </div>
  </section>

  <section class="ask" id="ask">
    <h2 data-i18n="ask_title"></h2>
    <form class="search-wrap" id="form" autocomplete="off">
      <div class="search glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input id="query" type="text" maxlength="500" data-i18n-placeholder="placeholder" data-i18n-label="search_label"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
        <button class="btn primary" type="submit" id="go" data-i18n="go"></button>
        <button class="btn toggle" type="button" id="toggle" aria-expanded="false" aria-controls="options" data-i18n-label="options">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>
        </button>
      </div>
      <ul class="suggest glass" id="suggest" role="listbox" hidden></ul>
    </form>
    <div class="chips" id="chips" aria-live="polite"></div>
    <div class="options glass" id="options" inert>
      <div class="options-inner"><div class="option-grid" id="option-grid"></div></div>
    </div>
    <p class="hint" data-i18n="hint"></p>
    <p class="hint error" id="error" hidden></p>
  </section>

  <section class="results" id="results" hidden aria-live="polite"></section>
</main>

<footer class="site big">
  <div class="wordmark" data-brand aria-hidden="true"></div>
  <p><span data-brand></span> · Ethan Petain, Alfred De Vulpian, Nicolas Cottez-Abrate, Thomas Confolent · <a href="https://github.com/Alfred0404/recsys_project">GitHub</a></p>
</footer>
<template id="loader"><svg class="mark-anim loop" viewBox="0 0 100 100" aria-hidden="true"><g fill="#f4f4f5"><rect x="14" y="14" width="14" height="14" rx="4"/><rect x="38" y="14" width="14" height="14" rx="4"/><rect x="62" y="14" width="14" height="14" rx="4"/><rect x="14" y="38" width="14" height="14" rx="4"/><rect x="38" y="38" width="14" height="14" rx="4"/><rect x="62" y="38" width="14" height="14" rx="4"/><rect x="14" y="62" width="14" height="14" rx="4"/><rect x="38" y="62" width="14" height="14" rx="4"/></g><rect class="piece" x="65" y="65" width="16" height="16" rx="4.6"/></svg></template>

<script src="i18n.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
